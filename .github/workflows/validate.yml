name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  json-and-schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install 'jsonschema[format]==4.23.0'

      - name: Validate all JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.json' -not -path './.git/*')
          if [ -z "$files" ]; then
            echo "No JSON files found"
            exit 0
          fi
          for f in $files; do
            echo "Validating JSON syntax: $f"
            python -m json.tool "$f" >/dev/null
          done

      - name: Validate schemas, adapters, and data catalog
        shell: python
        run: |
          import json
          from collections import Counter
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_dir = Path('packages/schemas')
          schemas = {}

          for path in schema_dir.glob('*.schema.json'):
              data = json.loads(path.read_text())
              Draft202012Validator.check_schema(data)
              schemas[path.name] = data
              print(f'Valid JSON Schema: {path}')

          format_checker = FormatChecker()
          institution_validator = Draft202012Validator(
              schemas['institution-record.schema.json'],
              format_checker=format_checker,
          )
          adapter_validator = Draft202012Validator(
              schemas['country-adapter-manifest.schema.json'],
              format_checker=format_checker,
          )

          manifests = sorted(Path('adapters').glob('*/adapter.manifest.json'))
          if not manifests:
              raise SystemExit('No country adapter manifests found')

          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text())
              errors = sorted(adapter_validator.iter_errors(manifest), key=lambda e: list(e.path))
              if errors:
                  for error in errors:
                      print(f'{manifest_path} {list(error.path)}: {error.message}')
                  raise SystemExit(1)
              print(f'Validated adapter manifest: {manifest_path}')

              dataset_path = manifest_path.parent / manifest['institution_dataset']
              if not dataset_path.exists():
                  raise SystemExit(f'Manifest institution dataset does not exist: {dataset_path}')

              records = json.loads(dataset_path.read_text())
              if not isinstance(records, list):
                  raise SystemExit(f'Institution dataset must be an array: {dataset_path}')

              ids = []
              for index, record in enumerate(records):
                  record_errors = sorted(
                      institution_validator.iter_errors(record),
                      key=lambda e: list(e.path),
                  )
                  if record_errors:
                      for error in record_errors:
                          print(f'{dataset_path}[{index}] {list(error.path)}: {error.message}')
                      raise SystemExit(1)
                  ids.append(record['institution_id'])

              duplicate_ids = sorted(k for k, count in Counter(ids).items() if count > 1)
              if duplicate_ids:
                  raise SystemExit(f'Duplicate institution_id values in {dataset_path}: {duplicate_ids}')
              print(f'Validated {len(records)} institution records: {dataset_path}')

          catalog_path = Path('registry/DATA_CATALOG.json')
          catalog = json.loads(catalog_path.read_text())
          datasets = catalog.get('datasets', [])
          dataset_ids = [item.get('dataset_id') for item in datasets]
          duplicate_dataset_ids = sorted(k for k, count in Counter(dataset_ids).items() if count > 1)
          if duplicate_dataset_ids:
              raise SystemExit(f'Duplicate dataset_id values: {duplicate_dataset_ids}')

          for item in datasets:
              local_path = item.get('path')
              if local_path and not Path(local_path).exists():
                  raise SystemExit(f'Catalog path does not exist: {local_path}')
              schema_path = item.get('schema')
              if schema_path and not Path(schema_path).exists():
                  raise SystemExit(f'Catalog schema does not exist: {schema_path}')
              source_index = item.get('source_index')
              if source_index and not Path(source_index).exists():
                  raise SystemExit(f'Catalog source index does not exist: {source_index}')
          print(f'Validated {len(datasets)} data catalog entries')

  policy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required architecture and governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            CONTRIBUTING.md
            SECURITY.md
            ROADMAP.md
            CHANGELOG.md
            docs/README.md
            docs/ARCHITECTURE.md
            docs/CITIZEN_PROTOCOL.md
            docs/GOVERNANCE.md
            docs/TRUST_AND_SAFETY.md
            docs/DATA_GOVERNANCE.md
            docs/DATA_CATALOG.md
            docs/GLOSSARY.md
            docs/INSTITUTION_ROUTING.md
            docs/INSTITUTION_REGISTRY_STANDARD.md
            docs/COUNTRY_ADAPTER_STANDARD.md
            docs/EQUATION_BINDINGS.md
            docs/RELEASE_AND_VERSIONING.md
            docs/SPECIFICATION_STATUS.md
            registry/DATA_CATALOG.json
            packages/schemas/README.md
            packages/schemas/case-passport.schema.json
            packages/schemas/return-object.schema.json
            packages/schemas/institution-record.schema.json
            packages/schemas/country-adapter-manifest.schema.json
            adapters/README.md
            adapters/thailand/adapter.manifest.json
            adapters/thailand/SOURCES.md
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Verify equation authority boundary is declared
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'morrocwi/toledo' README.md
          grep -q 'morrocwi/toledo' registry/README.md
          grep -q 'morrocwi/toledo' docs/SPECIFICATION_STATUS.md
          grep -q '361546c934829de56f3dcff2032c740209de847a' docs/EQUATION_BINDINGS.md

      - name: Verify citizen safety invariants are documented
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'AI-first' docs/TRUST_AND_SAFETY.md
          grep -q 'P_C' docs/GLOSSARY.md
          grep -qi 'Return Gate' docs/GLOSSARY.md
          grep -qi 'Case Passport' docs/ARCHITECTURE.md
          grep -qi 'Academic capability != university executability' docs/GLOSSARY.md

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject common secret/private-case file patterns
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -type f \
            \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' \) \
            -not -path './.git/*' || true)
          if [ -n "$bad" ]; then
            echo "Potential secret-bearing files committed:"
            echo "$bad"
            exit 1
          fi
