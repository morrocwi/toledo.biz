name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  json-and-schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'jsonschema[format]==4.23.0'
      - name: Validate all JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.json' -not -path './.git/*')
          for f in $files; do python -m json.tool "$f" >/dev/null; done
      - name: Validate schemas, adapters, catalog, and equation mirror
        shell: python
        run: |
          import json
          from collections import Counter
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_dir = Path('packages/schemas')
          schemas = {}
          for path in schema_dir.glob('*.schema.json'):
              data = json.loads(path.read_text())
              Draft202012Validator.check_schema(data)
              schemas[path.name] = data
              print(f'Valid JSON Schema: {path}')

          required_schemas = {
              'case-passport.schema.json',
              'case-event.schema.json',
              'case-step-request.schema.json',
              'case-step-response.schema.json',
              'problem-signature.schema.json',
              'decision-thread.schema.json',
              'execution-routing.schema.json',
              'return-object.schema.json',
              'institution-record.schema.json',
              'country-adapter-manifest.schema.json',
              'protocol-compile-request.schema.json',
              'protocol-instance.schema.json',
          }
          missing = sorted(required_schemas - set(schemas))
          if missing:
              raise SystemExit(f'Missing required schemas: {missing}')

          fmt = FormatChecker()
          institution_validator = Draft202012Validator(schemas['institution-record.schema.json'], format_checker=fmt)
          adapter_validator = Draft202012Validator(schemas['country-adapter-manifest.schema.json'], format_checker=fmt)

          manifests = sorted(Path('adapters').glob('*/adapter.manifest.json'))
          if not manifests:
              raise SystemExit('No country adapter manifests found')
          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text())
              errors = list(adapter_validator.iter_errors(manifest))
              if errors:
                  for error in errors: print(manifest_path, list(error.path), error.message)
                  raise SystemExit(1)
              dataset_path = manifest_path.parent / manifest['institution_dataset']
              records = json.loads(dataset_path.read_text())
              ids = []
              for index, record in enumerate(records):
                  errors = list(institution_validator.iter_errors(record))
                  if errors:
                      for error in errors: print(dataset_path, index, list(error.path), error.message)
                      raise SystemExit(1)
                  ids.append(record['institution_id'])
              duplicates = [k for k, n in Counter(ids).items() if n > 1]
              if duplicates: raise SystemExit(f'Duplicate institution IDs: {duplicates}')
              print(f'Validated {len(records)} institution records: {dataset_path}')

          catalog = json.loads(Path('registry/DATA_CATALOG.json').read_text())
          datasets = catalog.get('datasets', [])
          ids = [x.get('dataset_id') for x in datasets]
          duplicates = [k for k, n in Counter(ids).items() if n > 1]
          if duplicates: raise SystemExit(f'Duplicate dataset IDs: {duplicates}')
          for item in datasets:
              if item.get('path') and not Path(item['path']).exists():
                  raise SystemExit(f"Missing catalog path: {item['path']}")
              if item.get('schema') and not Path(item['schema']).exists():
                  raise SystemExit(f"Missing catalog schema: {item['schema']}")
              if item.get('source_index') and not Path(item['source_index']).exists():
                  raise SystemExit(f"Missing source index: {item['source_index']}")

          eq = json.loads(Path('registry/equation-index.json').read_text())
          entries = eq.get('entries', [])
          if len(entries) != 36:
              raise SystemExit(f'Expected 36 equation readouts, got {len(entries)}')
          eq_ids = [x['id'] for x in entries]
          if len(eq_ids) != len(set(eq_ids)):
              raise SystemExit('Duplicate equation IDs in read mirror')
          if eq.get('source', {}).get('commit') != '361546c934829de56f3dcff2032c740209de847a':
              raise SystemExit('Equation mirror is not pinned to declared upstream commit')
          if eq.get('authority') != 'mirror_only':
              raise SystemExit('Equation index must remain mirror_only')
          print('Validated equation read mirror')

  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference runtime
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q src apps
      - name: Run deterministic runtime tests
        run: python -m unittest discover -s tests -v
      - name: Smoke import API, MCP, closed-loop engine, Decision Threads, and execution routing
        run: |
          python - <<'PY'
          from apps.protocol_api.main import app
          from apps.mcp_server.server import mcp
          from toledo_runtime import EquationStore, create_case_passport, step_case, __version__
          assert app.title == 'Toledo Protocol API'
          assert mcp is not None
          assert len(EquationStore().list()) == 36
          passport = create_case_passport({'problem': 'synthetic test problem'})
          result = step_case({'passport': passport})
          assert result['case_id'] == passport['case_id']
          assert result['passport_version'] == 1
          assert len(result['thread_protocols']) == 1
          assert result['primary_thread_id'] == passport['primary_thread_id']
          assert result['protocol']['execution_routing']['ai_role']['class'] == 'MEDIATOR_TRANSLATOR'
          assert result['protocol']['execution_routing']['phase_semantics'] == 'ROUTING_CONTEXT_NOT_MANDATORY_SEQUENCE'
          assert __version__ == '0.6.0'
          print('Runtime, Decision Threads, execution routing, API, MCP, problem grammar, and equation mirror OK')
          PY

  policy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required architecture, runtime, and governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md ROADMAP.md CHANGELOG.md pyproject.toml llms.txt
            .well-known/toledo.json openapi/toledo.protocol.v1.yaml
            docs/README.md docs/ARCHITECTURE.md docs/CITIZEN_PROTOCOL.md docs/GOVERNANCE.md
            docs/TRUST_AND_SAFETY.md docs/DATA_GOVERNANCE.md docs/DATA_CATALOG.md docs/GLOSSARY.md
            docs/PROBLEM_CAPABILITY_GRAMMAR.md docs/EXECUTION_ROUTING.md docs/DECISION_THREADS.md docs/adr/0005-anchor-preserved-decision-threads.md
            docs/INSTITUTION_ROUTING.md docs/INSTITUTION_REGISTRY_STANDARD.md docs/COUNTRY_ADAPTER_STANDARD.md
            docs/EQUATION_BINDINGS.md docs/PROTOCOL_COMPILER.md docs/CASE_LIFECYCLE.md docs/API.md docs/MCP.md
            docs/RELEASE_AND_VERSIONING.md docs/SPECIFICATION_STATUS.md
            registry/README.md registry/DATA_CATALOG.json registry/equation-index.json
            packages/schemas/README.md packages/schemas/case-passport.schema.json packages/schemas/case-event.schema.json
            packages/schemas/case-step-request.schema.json packages/schemas/case-step-response.schema.json
            packages/schemas/problem-signature.schema.json packages/schemas/decision-thread.schema.json
            packages/schemas/execution-routing.schema.json packages/schemas/return-object.schema.json packages/schemas/institution-record.schema.json
            packages/schemas/country-adapter-manifest.schema.json
            packages/schemas/protocol-compile-request.schema.json packages/schemas/protocol-instance.schema.json
            adapters/README.md adapters/thailand/adapter.manifest.json adapters/thailand/SOURCES.md
            src/toledo_runtime/cases.py src/toledo_runtime/protocol.py src/toledo_runtime/execution.py src/toledo_runtime/threads.py
            apps/protocol_api/main.py apps/mcp_server/server.py
          )
          for f in "${required[@]}"; do test -f "$f" || { echo "Missing required file: $f"; exit 1; }; done
      - name: Verify equation authority boundary is declared
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'morrocwi/toledo' README.md
          grep -q 'morrocwi/toledo' registry/README.md
          grep -q '361546c934829de56f3dcff2032c740209de847a' docs/EQUATION_BINDINGS.md
          grep -q 'mirror_only' registry/equation-index.json
      - name: Verify citizen safety, continuity, multi-decision, and execution-routing invariants are documented
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'AI-first' docs/TRUST_AND_SAFETY.md
          grep -q 'P_C' docs/GLOSSARY.md
          grep -qi 'Return Gate' docs/GLOSSARY.md
          grep -qi 'Case Passport' docs/ARCHITECTURE.md
          grep -qi 'Academic capability != university executability' docs/GLOSSARY.md
          grep -q 'Protocol engine controls typed gates' AGENTS.md
          grep -q 'Route Failure != Case Failure' docs/CASE_LIFECYCLE.md
          grep -q 'P_C = citizen_problem_verbatim' docs/CASE_LIFECYCLE.md
          grep -q 'Occupation != ProtocolSelector' docs/PROBLEM_CAPABILITY_GRAMMAR.md
          grep -q 'ProblemSignature != Diagnosis' docs/PROBLEM_CAPABILITY_GRAMMAR.md
          grep -q 'Case != SingleDecision' docs/DECISION_THREADS.md
          grep -q 'ThreadPhase != CaseMaturity' docs/DECISION_THREADS.md
          grep -q 'AI != ExpertClass' docs/EXECUTION_ROUTING.md
          grep -q 'InteractionExpert != FieldExpert' docs/EXECUTION_ROUTING.md
          grep -q 'Phase != MandatorySequence' docs/EXECUTION_ROUTING.md
          grep -q 'ForwardExperiment != PermissionToIgnoreHardGates' docs/EXECUTION_ROUTING.md

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secret/private-case file patterns
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -type f \
            \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' \) \
            -not -path './.git/*' || true)
          if [ -n "$bad" ]; then echo "Potential secret-bearing files committed:"; echo "$bad"; exit 1; fi
