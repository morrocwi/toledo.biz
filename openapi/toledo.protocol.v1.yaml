openapi: 3.1.0
info:
  title: Toledo Protocol API
  version: 0.5.0
  description: Reference API for Toledo citizen protocol compilation, domain-neutral problem signatures, flexible execution routing, anchor-preserved Decision Threads, closed-loop Case Passport lifecycle, equation readouts and governed routing.
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Service health}
  /.well-known/toledo:
    get:
      operationId: getToledoManifest
      responses:
        '200': {description: Toledo service manifest}
  /v1/equations:
    get:
      operationId: searchEquations
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: domain, in: query, schema: {type: string}}
        - {name: live, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Equation list/readouts}
  /v1/equations/{equation_id}:
    get:
      operationId: getEquation
      parameters:
        - {name: equation_id, in: path, required: true, schema: {type: string}}
        - {name: live, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Equation readout with provenance}
        '404': {description: Equation not found}
  /v1/protocols/compile:
    post:
      operationId: compileProtocol
      description: Compile one compact decision state, including flexible execution requirements. P0-P11 are routing context rather than a mandatory expert/tool sequence. For a full multi-decision Case Passport use /v1/cases/threads/compile or /v1/cases/step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../packages/schemas/protocol-compile-request.schema.json'
      responses:
        '200':
          description: Compiled protocol instance including execution_routing and execution_requirements
          content:
            application/json:
              schema:
                $ref: '../packages/schemas/protocol-instance.schema.json'
  /v1/cases/init:
    post:
      operationId: initializeCase
      description: Create a Case Passport, create a backward-compatible primary Decision Thread when none is supplied, and compile all Decision Threads. The reference API does not persist the passport.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../packages/schemas/protocol-compile-request.schema.json'
      responses:
        '200':
          description: Case Passport, primary protocol and all Decision Thread protocols
          content:
            application/json:
              schema:
                $ref: '../packages/schemas/case-step-response.schema.json'
        '422': {description: Invalid case input}
  /v1/cases/update:
    post:
      operationId: updateCase
      description: Apply one auditable Case Event to a caller-held Case Passport. Supported events may be scoped to a Decision Thread with payload.thread_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passport, event]
              properties:
                passport: {$ref: '../packages/schemas/case-passport.schema.json'}
                event: {$ref: '../packages/schemas/case-event.schema.json'}
      responses:
        '200': {description: Updated Case Passport plus Decision Thread protocols}
        '422': {description: Invalid passport or event}
  /v1/cases/step:
    post:
      operationId: advanceCase
      description: Initialize or update a Case Passport and compile primary plus all Decision Threads. Thread dependencies can produce HOLD_FOR_DEPENDENCY; hard safety/authority escalation remains higher priority. Each protocol includes flexible execution routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../packages/schemas/case-step-request.schema.json'
      responses:
        '200':
          description: Updated passport, primary protocol and all Decision Thread protocols
          content:
            application/json:
              schema:
                $ref: '../packages/schemas/case-step-response.schema.json'
        '422': {description: Invalid case transition}
  /v1/cases/threads/compile:
    post:
      operationId: compileCaseThreads
      description: Compile every Decision Thread in a caller-held Case Passport without applying an event. Each thread protocol includes flexible execution requirements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../packages/schemas/case-passport.schema.json'
      responses:
        '200':
          description: Decision Thread protocol instances
          content:
            application/json:
              schema:
                type: object
                required: [case_id, primary_thread_id, count, thread_protocols]
                properties:
                  case_id: {type: [string, 'null']}
                  primary_thread_id: {type: [string, 'null']}
                  count: {type: integer, minimum: 1}
                  thread_protocols:
                    type: array
                    items: {$ref: '../packages/schemas/protocol-instance.schema.json'}
        '422': {description: Invalid Case Passport or Decision Thread state}
  /v1/institutions:
    get:
      operationId: routeInstitutions
      parameters:
        - {name: jurisdiction, in: query, schema: {type: string, default: TH}}
        - {name: phase, in: query, schema: {type: string}}
        - {name: capability, in: query, schema: {type: string}}
        - {name: target_user, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 25, default: 5}}
      responses:
        '200': {description: Institution candidates matched by capability/phase/access constraints}
  /v1/handoffs/validate:
    post:
      operationId: validateHandoff
      responses:
        '200': {description: TCB-X003 predicate readout}
  /v1/returns/validate:
    post:
      operationId: validateReturnGate
      responses:
        '200': {description: TCB-X005 predicate readout}
  /v1/schemas/{schema_name}:
    get:
      operationId: getSchema
      parameters:
        - name: schema_name
          in: path
          required: true
          schema:
            type: string
            enum:
              - case-passport
              - case-event
              - case-step-request
              - case-step-response
              - problem-signature
              - decision-thread
              - execution-routing
              - return-object
              - institution-record
              - protocol-compile-request
              - protocol-instance
      responses:
        '200': {description: Repository-controlled JSON Schema}
        '404': {description: Schema not found}
